<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="/src_frontend/styles/index.css?v=002">
        <link rel="stylesheet" href="/src_frontend/styles/unstructuredGrid.css?v=001">
        <link rel="stylesheet" href="/src_frontend/styles/gridLayout.css?v=002">
    </head>
    <body>
        <div class="data-source">
            <input type="radio" id="new-database" name="project" checked=true>
            <label for="new-database">Use database</label>
            <input type="radio" id="new-map" name="project" style="margin-left: 100px;">
            <label for="new-map">Draw on the map</label>
        </div>
        <div class="data-source" id="select-container">
            <label style="font-weight: normal;">Municipality</label>
            <div class="municipality-container">
                <input type="text" id="municipality-name"
                    placeholder="Choose from the list"/>
                <ul id="municipality-list"></ul>
            </div>
            <label id="lake-name-label" style="font-weight: normal; margin-left: 50px;">Lake</label>
            <select id="lake-name"><option value="">-- No selected --</option></select>
            <div class="search-box">
                <label><i class="fas fa-search"></i></label>
                <div class="search-input-wrapper">
                    <input type="text" id="lake-search" placeholder="Search lake..."/>
                    <div id="lake-suggestions"></div>
                </div>
            </div>
        </div>
        <div class="group-container" id="table-of-contents">
            <div><h3>Table of contents</h3></div>
            <table class="attributes-table" id="lake-table">
                <thead>
                    <tr>
                        <th>Name</th> <th>Municipality</th> <th>Area (m²)</th> <th>Perimeter (m)</th>
                        <th>Max Depth (m)</th> <th>Min Depth (m)</th> <th>Average Depth (m)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><input type="text" placeholder="Name"></td>
                        <td><input type="text" placeholder="Municipality"></td>
                        <td><input type="text" placeholder="Area"></td>
                        <td><input type="text" placeholder="Perimeter"></td>
                        <td><input type="text" placeholder="Max Depth"></td>
                        <td><input type="text" placeholder="Min Depth"></td>
                        <td><input type="text" placeholder="Average Depth"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="group-container-grid" id="menu-container">
            <div class="control-tab"> 
                <label class="checkbox-right">
                    <input type="checkbox" id="polygon-checkbox"><span>Show Polygon</span>
                </label>
                <label class="checkbox-right">
                    <input type="checkbox" id="depth-checkbox"><span>Show Depth</span>
                </label> 
            </div> 
            <div class="control-tab"> 
                <button class="button-grid" id="vertexes-btn">
                    Get/Reset Vertexes<span class="ink"></span>
                </button> 
                <label class="checkbox-right">
                    <input type="checkbox" id="refinement-checkbox"><span>Refine Vertexes</span>
                </label> 
                <div class="content-line" id ="refinement-container" style="display: none;"> 
                    <input type="text" id="refinement-value" style="width: 100px;"
                        placeholder="Enter refinement value" value="200.0"> 
                    <label style="width: 5px;">(m)</label> 
                </div> 
            </div> 
            <div class="control-tab">
                <label class="checkbox-right">
                    <input type="checkbox" id="move-checkbox"><span>Move Vertex</span>
                </label>
                <label class="checkbox-right">
                    <input type="checkbox" id="delete-checkbox">Delete Vertexes
                </label>
                <div class="control-tab-inline">
                    <label for="scale-factor">Mode (and level)</label>
                    <select id="scale-factor">
                        <option value="auto" selected>Auto</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>
                <input type="number" id="custom-scale-factor" placeholder="Scale" step="0.1" value="1.0" hidden>
            </div>
            <div class="control-tab"> 
                <button class="button-grid" id="generate-grid">Generate Grid<span class="ink"></span></button> 
                <label class="checkbox-right">
                    <input type="checkbox" id="orthogonality-checkbox">Orthogonality
                </label> 
                <label class="checkbox-right">
                    <input type="checkbox" id="optimization-checkbox">Grid Optimization
                </label> 
            </div> 
            <div class="control-tab" id="grid-optimization-container"> 
                <div class="control-tab-inline"> 
                    <label>Iterations</label>
                    <input type="text" id="iterations" value="500" style="width: 100%;"> 
                </div> 
                <div class="control-tab-inline"> 
                    <label>Level</label>
                    <div class="content-line">
                        <input type="text" id="detail-level-from" value="0" style="width: 20px;"> 
                        <label style="width: 22px;"> --> </label> 
                        <input type="text" id="detail-level-to" value="500" style="width: 40px;"> 
                    </div>
                </div> 
                <button class="button-grid" id="optimize-grid">Optimize Orthogonality<span class="ink"></span></button> 
            </div> 
            <div class="control-tab"> 
                <label for="grid-name" style="justify-content: center; width: 100%;">Grid Name (*.nc)</label> 
                <input type="text" id="grid-name" placeholder="Enter grid name" style="text-align: center;" value="Grid">
                <button class="save-grid" id="save-grid">Save Grid<span class="ink"></span></button> 
            </div>
        </div>
        <!-- Add the map -->
        <div class="map-container" id="map-container">
            <div id="leaflet-map-lakes"></div>
            <img class="leaflet-compass-grid" src="/src_frontend/images/compass.png">
            <div class="basemap-container-grid">
                <button type="button" class="leaflet-basemap-btn" id="basemap-btn">
                    <img src="/src_frontend/images/basemap.png">
                </button>
                <div class="basemap-popup">
                    <div><strong>Select Base Map</strong></div>
                    <button class="basemap-option" data-url="https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png">Open Street Map</button>
                    <button class="basemap-option" data-url="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}">Satellite</button>
                    <button class="basemap-option" data-url="https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}">Street</button>
                    <button class="basemap-option" data-url="https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png">Carto Light</button>
                    <button class="basemap-option" data-url="https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png">Carto Dark</button>
                </div>
            </div>
            <!-- Legend -->
            <div id="custom-colorbar-grid">
                <div class="colorbar-wrapper">
                    <div class="colorbar-title" id="colorbar-title">Legend</div>
                    <div class="colorbar-gradient" id="colorbar-gradient"></div>
                    <div class="colorbar-labels" id="colorbar-label">
                        <div></div> <!-- max -->
                        <div></div> <!-- 75% -->
                        <div></div> <!-- 50% -->
                        <div></div> <!-- 25% -->
                        <div></div> <!-- min -->
                    </div>
                </div>
            </div>
        </div>
        <!-- Grid Optimization Plot -->
        <div class="grid-optimization-container" id="plot-container" style="display: none;">
            <div class="table-header"><h3>Optimization Progress</h3></div>
            <div class="control-tab-inline-grid">
                <div class="progress-container">
                    <progress id="progressbar-grid" value="0" max="100"></progress>
                    <label id="progress-text-grid"></label>
                </div>
                <button class="button-grid" id="optimization-close">Stop<span class="ink"></span></button>
            </div>
            <div class="table-header"><h3>Optimization History</h3></div>
            <div id="myChart-grid"></div>
        </div>
        <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
        <script src="https://cdn.plot.ly/plotly-2.26.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
        <script type="module" src="/src_frontend/services/unstructuredGridManager.js?v=1"></script>
    </body>
</html>
